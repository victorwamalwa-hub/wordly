<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordly — Interactive Dictionary</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <header class="wordly-header">
        <h1>Wordly</h1>
        <p>An interactive dictionary built for language learners</p>
    </header>

    <main class="wordly-main">

        <!-- SEARCH FORM -->
        <form id="word-form" class="search-form" aria-label="Search for a word" onsubmit="event.preventDefault();"></form>
            <label for="word-input" class="visually-hidden">Enter a word</label>
            <input
                type="text"
                id="word-input"
                placeholder="Type a word (e.g. serendipity)"
                autocomplete="off"
                required
            />
            <button type="submit" id="search-btn">Search</button>
        </form>

        <!-- STATUS MESSAGE (errors, loading) -->
        <div id="status" class="status-message" role="status" aria-live="polite"></div>

        <!-- SAVED WORDS -->
        <section class="saved-section" id="saved-section" style="display: none;">
            <h2>Saved Words</h2>
            <ul id="saved-list" class="saved-list"></ul>
        </section>

        <!-- RESULT AREA -->
        <section id="result" class="result-area"></section>

    </main>

    <footer class="wordly-footer">
        <p>Data from <a href="https://dictionaryapi.dev/" target="_blank" rel="noopener">Free Dictionary API</a></p>
    </footer>

    <script src="wordly.js"></script>
</body>
</html>
